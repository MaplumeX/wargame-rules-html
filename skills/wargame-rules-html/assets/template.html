<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} 规则书</title>
<style>
:root{
  --map:#eaeee1; --sheet:#fcfdf9; --sheet2:#f2f4ec; --ink:#1f271e; --ink2:#5a6454; --rule:#d9dfcf;
  --olive:#536a4b; --olive-t:#e2e9d8; --pa:#a32237; --pa-t:#f8e6e6; --fr:#17707c; --de:#515a6d; 
  --hl:#f4d97a; --dot-mix:0%; --chip-ink:#fff; --shadow:0 8px 28px rgba(30,40,25,.16);
  --stick:44px;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --num:"Bahnschrift","DIN Alternate","DIN Condensed","Oswald","Arial Narrow","Noto Sans SC",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --map:#0f151c; --sheet:#17202a; --sheet2:#1e2935; --ink:#e1e8e2; --ink2:#9aa9a6; --rule:#2f3d4a;
  --olive:#9eb891; --olive-t:#24322a; --pa:#f08795; --pa-t:#3a2029; --fr:#7fd0db; --de:#b3bdd2; 
  --hl:#8a7426; --dot-mix:45%; --chip-ink:#10161c; --shadow:0 8px 28px rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --map:#0f151c; --sheet:#17202a; --sheet2:#1e2935; --ink:#e1e8e2; --ink2:#9aa9a6; --rule:#2f3d4a;
    --olive:#9eb891; --olive-t:#24322a; --pa:#f08795; --pa-t:#3a2029; --fr:#7fd0db; --de:#b3bdd2; 
    --hl:#8a7426; --dot-mix:45%; --chip-ink:#10161c; --shadow:0 8px 28px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--map);color:var(--ink);font:16.5px/1.8 var(--body);line-break:strict;text-autospace:normal}
p,li,td,figcaption{text-wrap:pretty}
.ttl,.part-h h1,.hero h1,.hero p{text-wrap:balance}
a{color:inherit}
:focus-visible{outline:2px solid var(--pa);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- 布局 ---------- */
.side{position:fixed;inset:0 auto 0 0;width:292px;display:flex;flex-direction:column;background:var(--map);z-index:30}
.main{margin-left:292px;background:var(--sheet);min-height:100vh}
.wrap{max-width:800px;margin:0 auto;padding:0 40px 96px}
.topbar{display:none}

/* ---------- 侧边栏 ---------- */
.side-head{padding:20px 16px 12px}
.brand{display:block;font-weight:800;font-size:21px;letter-spacing:.04em;text-decoration:none;line-height:1.3}
.brand small{display:block;font:500 12px/1.5 var(--num);letter-spacing:.04em;color:var(--ink2)}
.search{display:flex;align-items:center;gap:8px;width:100%;height:38px;margin-top:12px;padding:0 9px 0 11px;border:0;border-radius:8px;background:var(--sheet);color:var(--ink2);font-size:14px;text-align:left}
.search span{flex:1}
.search svg,.pal-in svg{flex:none}
kbd{font:12px/18px var(--num);padding:0 6px;border:1px solid var(--rule);border-radius:4px;color:var(--ink2)}
.tools{display:flex;gap:6px;margin-top:10px}
.tools button{flex:1;height:30px;font-size:12.5px;line-height:1;border:0;border-radius:6px;background:var(--sheet);color:var(--ink2);white-space:nowrap}
.tools button:hover{background:var(--olive-t)}
.track{flex:1;overflow-y:auto;padding:8px 8px 24px;overscroll-behavior:contain}
.track ol{list-style:none;margin:0;padding:0}
.t-group{margin:10px 0}
.t-group:first-child{margin-top:2px}
.t-part{display:flex;align-items:center;border-radius:7px}
.t-part:hover{background:var(--olive-t)}
.t-group.cur>.t-part{background:var(--sheet)}
.t-part a{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:4px 10px;font-size:14.5px;font-weight:700;line-height:1.5;letter-spacing:.02em;color:var(--ink2);text-decoration:none}
.t-part a::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,#fff var(--dot-mix),var(--pc))}
.t-part a:hover,.t-group.cur .t-part a{color:var(--ink)}
.t-group.cur .t-part a{font-weight:800}
.t-list{padding:3px 0 0}
.track{scrollbar-gutter:stable}
.track::-webkit-scrollbar,#results::-webkit-scrollbar{width:6px}
.track::-webkit-scrollbar-track,#results::-webkit-scrollbar-track{background:transparent}
.track::-webkit-scrollbar-thumb,#results::-webkit-scrollbar-thumb{border-radius:3px;background:color-mix(in srgb,var(--ink2) 35%,transparent)}
.track::-webkit-scrollbar-thumb:hover,#results::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--ink2) 60%,transparent)}
@supports not selector(::-webkit-scrollbar){.track,#results{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink2) 35%,transparent) transparent}}
.t-ch>a{display:flex;align-items:center;gap:9px;padding:3px 8px;border-radius:6px;text-decoration:none;font-size:14.5px;line-height:1.5}
.t-ch>a:hover{background:var(--olive-t)}
.t-ch .n{flex:0 0 40px;text-align:center;font:600 13px/21px var(--num);border-radius:5px;background:var(--sheet)}
.t-ch.on>a{font-weight:700}
.t-ch.on>a .n{background:var(--pa);color:var(--chip-ink)}
.t-sub{display:none;padding:2px 0 6px 49px}
.t-ch.on .t-sub{display:block}
.t-sub a{display:block;padding:2px 8px;border-radius:5px;text-decoration:none;font-size:13px;line-height:1.55;color:var(--ink2)}
.t-sub a b{font:500 12px var(--num);margin-right:5px}
.t-sub a:hover{background:var(--olive-t)}
.t-sub a.on{color:var(--pa);font-weight:700}

/* ---------- 封面 ---------- */
.hero{padding:52px 0 30px;border-bottom:1px solid var(--rule)}
.hero-eyebrow{font:600 14px/1 var(--num);letter-spacing:.14em;color:var(--olive)}
.hero h1{margin:12px 0 4px;font-size:clamp(46px,9vw,82px);font-weight:800;line-height:1.1;letter-spacing:.03em}
.hero p{margin:10px 0 0;color:var(--ink2);font-size:15.5px;max-width:36em}
.hexmap{margin:30px 0 8px}
.hexmap svg{display:block;width:100%;height:auto}
.hexmap .m{display:none}
.hx polygon{stroke:var(--sheet);stroke-width:3;transition:filter .15s}
.hx:hover polygon,.hx:focus-visible polygon{filter:brightness(.88)}
.hx text{text-anchor:middle;pointer-events:none}
.hx .hn{font:600 19px var(--num)}
.hx .ht{font:700 12.5px var(--body)}
.hl{font:800 15px var(--body);fill:var(--ink)}
.hl-a:hover .hl{fill:var(--pa)}
.hx polygon{fill:color-mix(in srgb,var(--pc) 30%,var(--sheet))}
.hx text{fill:var(--ink)}
.hx.solid polygon{fill:var(--pc)}
.hx.solid text{fill:#fff}

/* ---------- 章节 ---------- */
section,.part,#tf-now,#turn-track{scroll-margin-top:calc(var(--stick) + 10px)}
section.lv1,section.top{padding-top:56px}
section.lv2:not(.top){padding-top:36px}
section.lv3{padding-top:24px}
.part{padding-top:56px}
.part-h{margin:0;padding:20px 24px;border-radius:10px;background:var(--pc);color:#fff}
.part-h h1{margin:0;font-size:32px;font-weight:800;line-height:1.3;letter-spacing:.02em}
.part-h p{margin:4px 0 0;font-size:14.5px;opacity:.92}
.part-i{margin-top:14px}
.phase-card{margin:14px 0;padding:12px 18px;border-radius:10px;background:var(--sheet2)}
.phase-card ol{margin:0}
.phase-card li{margin:.4em 0}
.moved{margin:.25em 0;font-size:13px;color:var(--ink2)}
.moved a{color:var(--fr);text-decoration:none}
.tag{flex:none;font-size:12px;line-height:20px;padding:0 7px;border-radius:4px;background:var(--sheet2);color:var(--ink2);font-weight:700}
/* 阶段条 */
.sticky{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.pb{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.pb::-webkit-scrollbar{display:none}
.pb a{flex:none;padding:0 11px;line-height:32px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap}
.pb a:hover{background:var(--sheet2)}
.pb a.on{background:var(--ink);color:var(--sheet)}
.turn{flex:none;order:9;margin-left:auto;display:flex;align-items:stretch;height:32px;border-radius:6px;background:var(--pa);color:var(--chip-ink);overflow:hidden}
.turn button{display:flex;align-items:center;gap:2px;padding:0 8px;border:0;background:transparent;color:inherit;font-size:13.5px;font-weight:700}
.turn button:disabled{opacity:.4;cursor:default}
.pb #turn-chip{padding:0 6px;border-radius:0;font:600 13.5px/32px var(--num)}
.turn a:hover,.turn button:not(:disabled):hover{background:rgba(0,0,0,.15)}
/* 回合轨 */
.tt{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.tt-d{display:block}
.tt-d>span{display:block;font:600 12px/16px var(--num);color:var(--ink2);text-align:center}
.tt-g{display:flex;gap:2px}
.tt-c{width:40px;height:40px;padding:0;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tt-c b{font:600 15px/1 var(--num)}
.tt-c i{font:500 10px/1.2 var(--num);font-style:normal;color:var(--ink2);margin-top:2px}
.tt-c.n{background:var(--de);border-color:var(--de);color:var(--chip-ink)}.tt-c.n i{color:inherit;opacity:.8}
.tt-c[aria-pressed="true"]{background:var(--pa);border-color:var(--pa);color:var(--chip-ink)}.tt-c[aria-pressed="true"] i{color:inherit}
.tt-all{height:40px;padding:0 12px;font-size:13.5px;border:1px solid var(--rule);border-radius:4px;background:transparent}
.tt-all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet);font-weight:700}
.tf-now{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--pa-t);font-size:14.5px;line-height:1.7}
.tf-now>b{font:600 16px var(--num)}
.tf-now p{margin:.3em 0}
.now-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:6px}
.now-g h4{margin:0;font-size:14px;font-weight:700}
.now-g ul{margin:.2em 0;padding-left:1.2em}
table.cal td:nth-child(-n+3){white-space:nowrap}
table.cal ul{margin:0;padding-left:1.1em}
table.cal tr.now td{background:var(--pa-t)}
table.cal tr.night td:nth-child(3){font-weight:800}
.rix{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;font-size:14px;line-height:1.7}
.rix a{text-decoration:none}
.rix .rc{font-weight:800}
.rix .rs{color:var(--ink2);margin-left:.5em}
.rix .rs a{display:inline-block;font:500 13px var(--num);color:var(--fr);margin-right:.5em;white-space:nowrap}
h1.ch,h2.rh,h3.rh{margin:0;display:flex;align-items:baseline;gap:11px;line-height:1.35}
h1.ch{font-size:32px;font-weight:800;padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:18px}
h1.ch::before{content:"";flex:none;align-self:stretch;width:5px;border-radius:3px;background:color-mix(in srgb,#fff var(--dot-mix),var(--pc,var(--olive)))}
h2.rh{font-size:22px;font-weight:700;margin-bottom:10px}
h3.rh{font-size:17.5px;font-weight:600;margin-bottom:6px}
.rn{flex:none;font-family:var(--num);font-weight:600;color:var(--olive)}
h1.ch .rn{color:inherit}
h3.rh .rn{color:var(--ink2)}
.ttl{flex:1}
.tag{align-self:center}
.src{position:relative;flex:none;align-self:center;font:500 12px/22px var(--num);padding:0 6px;border:0;border-radius:5px;background:transparent;color:var(--ink2);opacity:.8;letter-spacing:.02em}
.src::after{content:"";position:absolute;inset:-10px -4px}
.src:hover{color:var(--pa);opacity:1}
.flash{animation:flash 1.5s ease-out}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:transparent}}
p{margin:.6em 0}
ol,ul{margin:.45em 0;padding-left:1.7em}
li{margin:.2em 0}
strong{font-weight:700}
code{font:600 .95em var(--num)}

.xref{font:600 .92em var(--num);color:var(--fr);text-decoration:none;border-bottom:1px dotted var(--fr);white-space:nowrap}
.xref:hover{color:var(--pa);border-color:var(--pa)}

/* ---------- 表格 ---------- */
.tw{margin:1em 0;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
th{font-weight:700;text-align:left;padding:8px 12px;white-space:nowrap;vertical-align:bottom;border-bottom:2px solid var(--ink)}
td{padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:hover td{background:var(--sheet2)}

/* ---------- 提示框 ---------- */
.call{margin:1em 0;padding:1px 0 1px 15px;border-left:3px solid var(--cc);font-size:15.5px;line-height:1.75}
.call>.lb{float:left;margin-right:9px;font-weight:700;color:var(--cc)}
.call p:first-of-type{margin-top:0}.call p:last-child{margin-bottom:0}
.call ul,.call ol{clear:both;margin:.3em 0 0}
.call.note{--cc:var(--pa)}
.call.except{--cc:var(--fr)}
.call.key{--cc:var(--ink);font-weight:700}
.call.explain,.call.designer{--cc:var(--olive);color:var(--ink2)}

/* ---------- 图与示例 ---------- */
figure{margin:1em 0}
figure img,.ex img{display:block;max-width:100%;height:auto;border-radius:6px;cursor:zoom-in;background:#fff}
figcaption{font-size:13px;line-height:1.6;color:var(--ink2);margin-top:5px}
.ex{margin:1em 0;border:1px solid var(--rule);border-radius:8px}
.ex>summary{cursor:pointer;padding:9px 14px;font-weight:700;font-size:14.5px;list-style:none;display:flex;gap:9px;align-items:center}
.ex>summary::-webkit-details-marker{display:none}
.ex>summary::before{content:"示例";flex:none;color:var(--de)}
.ex>summary::after{content:"";flex:none;margin:0 4px 3px auto;width:7px;height:7px;border:solid var(--ink2);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);transition:transform .15s}
.ex:not([open])>summary::after{transform:rotate(-45deg);margin-bottom:0}
.ex-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:2px 14px 14px;font-size:15px;line-height:1.75}
.ex-b.wide{grid-template-columns:minmax(0,1fr)}
.ex-b p:first-child{margin-top:0}

/* ---------- 流程 ---------- */
.turn-flow{margin-top:10px}
.tf-controls{padding:6px 0 10px;border-bottom:1px solid var(--rule)}
.tf-seg{margin:14px 0;padding:10px 18px 14px;border-radius:10px;background:var(--sheet2)}
.tf-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:12px}
.tf-side{padding:10px 16px 14px;border-radius:10px;border-top:3px solid;background:var(--sheet2);font-size:14.5px;line-height:1.7}
.tf-a{border-color:var(--de)}.tf-b{border-color:var(--fr)}
.tf-side h4{margin:.9em 0 .2em;font-size:15px;font-weight:800}
.tf-a h4{color:var(--de)}.tf-b h4{color:var(--fr)}
.tf-steps{padding-left:1.45em;margin:.2em 0}
.tf-note,.tf-inline-note{color:var(--pa);font-weight:700;font-size:13.5px}
.tf-note{margin:.45em 0}
.cond b{color:var(--olive)}
.turn-flow[data-time="all"] .cond+.cond::before{content:"；"}
.turn-flow:not([data-time="all"]) .cond b{display:none}
.struck{color:var(--ink2);text-decoration:line-through}
/* 可勾选的步骤：脚本给清单加上 .ckl，序号圆圈兼作勾选框 */
ol.ckl{list-style:none;padding-left:0;counter-reset:ck}
ol.ckl>li{position:relative;padding-left:35px;counter-increment:ck}
.ck{position:absolute;left:0;top:.18em;width:24px;height:24px;padding:0;display:grid;place-items:center;border:1.5px solid var(--ink2);border-radius:50%;background:transparent;color:var(--ink2);font:600 12.5px/1 var(--num)}
.ck::before{content:counter(ck)}
.ck::after{content:"";position:absolute;inset:-9px}
.ck[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.ck[aria-checked="true"]::before{content:"";width:5px;height:10px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
li.done{color:var(--ink2)}
.ck-reset{display:block;margin:8px 0 0 auto;padding:0 10px;height:30px;border:1px solid var(--rule);border-radius:6px;background:transparent;color:var(--ink2);font-size:13px}
.bdg{display:inline-block;margin-left:6px;font-size:12px;font-weight:800;color:var(--pa)}

.choice{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:.8em 0;font-size:14.5px;line-height:1.7}
.choice>div{padding:10px 14px;border:1px solid var(--rule);border-radius:8px}
.choice p:first-child{margin-top:0;font-size:15.5px}

/* ---------- 悬停卡、查看器 ---------- */
#pop{position:fixed;z-index:60;width:390px;max-width:calc(100vw - 24px);max-height:min(400px,60vh);overflow-y:auto;overscroll-behavior:contain;padding:10px 14px;border-radius:8px;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);font-size:14px;line-height:1.7;display:none}
#pop.show{display:block}
.pt{font-weight:800;font-size:15px;margin-bottom:4px}
.pt i{font:600 14px var(--num);color:var(--pa);margin-right:6px}
#pal::backdrop,#peek::backdrop{background:rgba(10,14,18,.45)}
#pal,#peek{padding:0;background:var(--sheet);color:var(--ink);box-shadow:var(--shadow);overflow:hidden}
#pal[open],#peek[open]{display:flex;flex-direction:column;animation:rise .16s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* 搜索面板 */
#pal{margin:11vh auto 0;width:min(640px,calc(100vw - 24px));max-width:none;max-height:min(72vh,600px);border:1px solid var(--rule);border-radius:12px}
.pal-in{flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 16px;border-bottom:1px solid var(--rule);color:var(--ink2)}
#q{flex:1;min-width:0;height:52px;padding:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:17px}
.pal-in button,.pk-h button{flex:none;height:34px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--ink2);font-size:13.5px}
.pal-in button:hover,.pk-h button:hover{background:var(--sheet2)}
#results{flex:1;min-height:0;overflow-y:auto;padding:6px;overscroll-behavior:contain}
.r{display:block;text-decoration:none;padding:8px 10px;border-radius:7px}
.r.sel{background:var(--olive-t)}
.r b{display:block;font-size:15px;font-weight:700;line-height:1.5}
.r b i{font:600 14px var(--num);margin-right:8px;color:var(--pa)}
.r span{display:block;font-size:13px;line-height:1.6;color:var(--ink2)}
.r mark{background:var(--hl);color:inherit;border-radius:2px}
.r-h{padding:8px 10px 4px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.r-empty{padding:18px 10px;color:var(--ink2);font-size:14.5px}
.pal-ft{flex:none;display:flex;gap:18px;padding:8px 16px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
/* 触屏上点引用：底部预览 */
#peek{margin:auto auto 0;width:min(640px,100vw);max-width:none;max-height:min(76vh,640px);max-height:min(76dvh,640px);border:0;border-radius:16px 16px 0 0}
.pk-h{flex:none;display:flex;align-items:center;gap:6px;padding:10px 8px 8px 18px;border-bottom:1px solid var(--rule)}
.pk-h .pt{flex:1;min-width:0;margin:0;font-size:16.5px}
#pk-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 18px 12px;font-size:15.5px;line-height:1.75}
.pk-f{flex:none;display:flex;gap:10px;padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--rule)}
.pk-f button{height:44px;padding:0 16px;border:1px solid var(--rule);border-radius:8px;background:transparent;font-size:15px;font-weight:700}
#pk-go{flex:1;background:var(--ink);border-color:var(--ink);color:var(--sheet)}
/* 跳转后的返回按钮 */
#back{position:fixed;z-index:22;bottom:calc(18px + env(safe-area-inset-bottom));left:calc(50% + 146px);transform:translateX(-50%);display:flex;max-width:min(440px,calc(100vw - 32px));border-radius:22px;background:var(--ink);color:var(--sheet);box-shadow:var(--shadow);overflow:hidden}
#back button{display:flex;align-items:center;gap:8px;height:44px;border:0;background:transparent;color:inherit}
#back-go{min-width:0;padding:0 6px 0 16px;font-size:14.5px;font-weight:700}
#back-go>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#back-x{flex:none;padding:0 14px 0 8px;opacity:.7}
#back svg{flex:none}
#pop table{font-size:12.5px}
#pop .call{font-size:13px}
#viewer{padding:0;border:0;background:transparent;width:100vw;height:100vh;max-width:none;max-height:none}
#viewer::backdrop{background:rgba(10,14,18,.86)}
.v-w{position:relative;height:100%;display:flex;flex-direction:column}
.v-bar{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;color:#fff;font-size:14px}
.v-bar b{font:600 15px var(--num);margin-right:auto}
.v-bar button{height:34px;padding:0 13px;border:1px solid #fff6;border-radius:6px;background:#0005;color:#fff}
.v-s{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:0 16px 16px}
.v-s img{display:block;max-width:min(980px,100%);height:auto;background:#fff;border-radius:3px}

/* ---------- 响应式 ---------- */
@media (max-width:1040px){
  .side{transform:translateX(-102%);transition:transform .2s;width:min(310px,86vw)}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .main{margin-left:0}
  :root{--stick:92px}
  .topbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:var(--map);border-bottom:1px solid var(--rule)}
  .topbar button{height:34px;padding:0 11px;border:1px solid var(--rule);border-radius:6px;background:transparent;font-size:14px}
  .topbar b{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .turn{order:-1;margin:0 4px 0 0;position:sticky;left:0;z-index:1;box-shadow:0 0 0 6px var(--sheet)}
  #back{left:50%}
  .scrim{position:fixed;inset:0;z-index:25;background:rgba(10,14,18,.45);display:none}
  .scrim.show{display:block}
}
@media (max-width:680px){
  .wrap{padding:0 16px 72px}
  .hero{padding-top:28px}
  .hexmap .d{display:none}.hexmap .m{display:block}
  h1.ch{font-size:25px}
  .tc-x,.pal-ft{display:none}
  #pal{margin-top:8px}
  h2.rh{font-size:19.5px}
  .ex-b,.tf-two,.choice{grid-template-columns:minmax(0,1fr)}
  table{font-size:13.5px}
  th{white-space:normal;padding:6px 7px}
  td{padding:6px 7px}
  .search kbd{display:none}
}
@media (pointer:coarse){
  .t-ch>a{padding:7px 8px}
  .t-sub a{padding:6px 8px}
}
@media print{
  .side,.sticky,.src,.tf-controls,#pop,#back,.ck-reset,.hexmap,.tf-now{display:none!important}
  .main{margin:0}.wrap{max-width:none;padding:0}
  body{background:#fff;font-size:11pt}
  section.lv1{break-before:page}
  .ex,figure,table{break-inside:avoid}
}
</style>
</head>
<body>
<aside class="side" id="side" aria-label="目录">
  <div class="side-head">
    <a class="brand" href="#top">{{TITLE}}<small>{{EYEBROW}}</small></a>
    <button type="button" class="search js-q"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>搜索规则或规则号</span><kbd>/</kbd></button>
    <div class="tools">
      <button type="button" id="t-ex">展开全部示例</button>
      <button type="button" id="t-th">切换日夜</button>
    </div>
  </div>
  <nav class="track" id="track"><ol>{{TOC}}</ol></nav>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main" id="top">
  <div class="sticky">
    <div class="topbar"><button type="button" id="menu">目录</button><b id="crumb">{{TITLE}}</b><button type="button" class="js-q">搜索</button></div>
    <nav class="pb" aria-label="对局阶段">{{PHASEBAR}}{{TURN_CHIP}}</nav>
  </div>
  <main class="wrap">
    <header class="hero">
      <div class="hero-eyebrow">{{EYEBROW}}</div>
      <h1>{{TITLE}}</h1>
      <p>{{HERO}}</p>
      <div class="hexmap">{{HEX_D}}{{HEX_M}}</div>
    </header>
    {{BODY}}
  </main>
</div>
<div id="pop" role="tooltip"></div>
<div id="back" hidden>
  <button type="button" id="back-go"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13 8H3m4-4L3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>返回 <span id="back-t"></span></span></button>
  <button type="button" id="back-x" aria-label="不再显示返回按钮"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>
<dialog id="pal" aria-label="搜索规则">
  <div class="pal-in"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" type="text" inputmode="search" enterkeyhint="go" placeholder="搜索规则或规则号" aria-label="搜索规则" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" id="pal-x">关闭</button></div>
  <div id="results" role="listbox" aria-label="搜索结果"></div>
  <div class="pal-ft"><span><kbd>↑</kbd> <kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 跳转</span><span><kbd>Esc</kbd> 关闭</span></div>
</dialog>
<dialog id="peek" aria-label="规则预览">
  <div class="pk-h"><div class="pt" id="pk-t"></div><button type="button" id="pk-x">关闭</button></div>
  <div id="pk-b"></div>
  <div class="pk-f"><button type="button" id="pk-prev" hidden>上一条</button><button type="button" id="pk-go">跳到这条规则</button></div>
</dialog>
<dialog id="viewer" aria-label="查看图片">
  <div class="v-w">
    <div class="v-bar"><b id="v-t"></b><button type="button" id="v-p">上一页</button><button type="button" id="v-n">下一页</button><button type="button" id="v-c">关闭</button></div>
    <div class="v-s"><img id="v-i" alt=""></div>
  </div>
</dialog>
{{SCANS}}
<script>
{{JS}}
</script>
</body>
</html>
